version: 2
models:
- name: stg_positions
  description: Typed synthetic holdings. Grain is position_id; demo is long-only.
  columns:
  - name: position_id
    description: Unique holding record identifier across dates.
    tests:
    - unique
    - not_null
  - name: valuation_date
    tests:
    - not_null
  - name: quantity
    tests:
    - not_null
  - name: portfolio_id
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('portfolios')
          field: portfolio_id
  - name: instrument_id
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('instruments')
          field: instrument_id
- name: stg_prices
  description: Unit prices per instrument and valuation date.
  columns:
  - name: unit_price
    tests:
    - not_null
- name: stg_fx_rates
  description: EUR received for one unit of source currency, by valuation date.
  columns:
  - name: rate_to_eur
    tests:
    - not_null
- name: int_position_valuation
  description: Holdings enriched with prices and FX; missing joins remain visible.
  columns:
  - name: position_id
    tests:
    - unique
    - not_null
  - name: market_value_eur
    tests:
    - not_null
- name: fct_portfolio_daily
  description: Gross holdings value in EUR per portfolio/day. Not NAV or accounting
    balance.
  columns:
  - name: total_value_eur
    tests:
    - not_null
- name: fct_reconciliation
  description: Internal value vs simulated independent custodian, absolute tolerance
    EUR 1.
  columns:
  - name: reconciliation_status
    tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - MATCH
          - BREAK
          - MISSING_INTERNAL
          - MISSING_CUSTODIAN
- name: fct_concentration
  description: Instrument weights against illustrative portfolio-specific thresholds.
  columns:
  - name: weight
    tests:
    - not_null
  - name: control_status
    tests:
    - accepted_values:
        arguments:
          values:
          - PASS
          - BREACH
